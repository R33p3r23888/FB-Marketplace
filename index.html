<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bazaar – Buy & Sell Near You</title>
<meta name="description" content="Buy and sell vehicles, electronics, homes and more locally.">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#14161f;--mu:#6b7186;--br:#e5e7ef;--ac:#5b5bf0;--ac2:#a855f7;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1017;--card:#171a24;--tx:#eef0f7;--mu:#8e94aa;--br:#262a38}}
*{box-sizing:border-box;margin:0}body{font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--br)}
.bar{max-width:1200px;margin:auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{flex:1;min-width:180px;display:flex;gap:8px}
input,select,textarea{background:var(--bg);border:1px solid var(--br);border-radius:12px;padding:10px 12px;width:100%;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 40%,transparent)}
.btn.ghost{background:var(--bg);color:var(--tx);border:1px solid var(--br)}
.btn.ghost:hover{box-shadow:none}
.tabs{display:flex;gap:6px}.tabs button{background:none;border:0;padding:8px 14px;border-radius:99px;cursor:pointer;color:var(--mu);font-weight:600;transition:.2s}
.tabs button.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
main{max-width:1200px;margin:auto;padding:20px 16px 80px}
.hero{border-radius:24px;padding:36px 28px;color:#fff;background:linear-gradient(120deg,#5b5bf0,#a855f7,#ec4899,#5b5bf0);background-size:300% 300%;animation:flow 12s ease infinite;margin-bottom:20px}
.hero h1{font-size:clamp(26px,5vw,42px);line-height:1.15}.hero p{opacity:.9;margin-top:8px}
@keyframes flow{50%{background-position:100% 50%}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.chip{border:1px solid var(--br);background:var(--card);padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:.2s}
.chip:hover{transform:translateY(-2px)}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--br);border-radius:18px;overflow:hidden;cursor:pointer;opacity:0;animation:up .5s forwards;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);box-shadow:0 14px 34px rgba(0,0,0,.14)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.img{aspect-ratio:4/3;display:grid;place-items:center;font-size:64px;background-size:cover;background-position:center;transition:transform .4s}
.card:hover .img{transform:scale(1.05)}.imgw{overflow:hidden}
.info{padding:12px 14px}.price{font-weight:800;font-size:18px}.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mu{color:var(--mu);font-size:13px}
.wlist{display:grid;gap:12px;max-width:760px}
.want{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:16px;display:flex;gap:12px;justify-content:space-between;align-items:center;opacity:0;animation:up .5s forwards}
.tag{display:inline-block;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.ov{position:fixed;inset:0;background:rgba(10,12,20,.6);backdrop-filter:blur(4px);display:none;place-items:center;z-index:50;padding:12px}
.ov.on{display:grid;animation:fade .2s}.modal{background:var(--card);border-radius:22px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}}
.modal h2{margin-bottom:12px}.f{display:grid;gap:10px}.row{display:flex;gap:10px}
.chat{display:grid;gap:8px;max-height:320px;overflow:auto;padding:8px 2px;margin:10px 0}
.m{max-width:80%;padding:8px 12px;border-radius:16px;animation:pop .25s;width:fit-content}
.m.me{background:var(--ac);color:#fff;margin-left:auto;border-bottom-right-radius:4px}.m.th{background:var(--bg);border-bottom-left-radius:4px}
.inbox{display:grid;gap:10px;max-width:760px}.thread{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:14px;cursor:pointer;transition:.2s}.thread:hover{transform:translateX(4px)}
.empty{text-align:center;color:var(--mu);padding:60px 0}
.fab{position:fixed;right:20px;bottom:20px;z-index:30;box-shadow:0 10px 30px rgba(91,91,240,.45)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:99;animation:up .3s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card,.want{opacity:1}}
</style></head><body>
<header><div class="bar">
<div class="logo">Bazaar</div>
<div class="search"><input id="q" placeholder="Search vehicles, phones, furniture…"><input id="city" placeholder="City" style="max-width:130px"></div>
<nav class="tabs"><button data-v="buy" class="on">Browse</button><button data-v="wanted">Buyers</button><button data-v="inbox">Messages</button></nav>
</div></header>
<main id="main"></main>
<button class="btn fab" id="post">+ Sell something</button>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('Storage full – try a smaller photo')}}};
const CATS=[['All','✨'],['Vehicles','🚗'],['Property','🏠'],['Electronics','📱'],['Home','🛋️'],['Fashion','👟'],['Sports','🚲'],['Other','📦']];
const EM=Object.fromEntries(CATS);
const seed=[
{id:1,title:'2019 Toyota Corolla SE',price:14500,cat:'Vehicles',city:'Austin',address:'120 Congress Ave, Austin TX',desc:'62k miles, clean title, one owner, new tires.',seller:'Mike R.',demo:1},
{id:2,title:'iPhone 15 Pro 256GB',price:780,cat:'Electronics',city:'Dallas',address:'45 Main St, Dallas TX',desc:'Like new, with box and case.',seller:'Sara K.',demo:1},
{id:3,title:'Mid-century sofa',price:320,cat:'Home',city:'Austin',address:'9 Oak Lane, Austin TX',desc:'Walnut legs, grey fabric, pet free.',seller:'Dan P.',demo:1},
{id:4,title:'Trek mountain bike',price:450,cat:'Sports',city:'Houston',address:'88 Bayou Rd, Houston TX',desc:'Size L, hydraulic brakes, serviced.',seller:'Lena V.',demo:1},
{id:5,title:'2BR apartment for rent',price:1350,cat:'Property',city:'Austin',address:'300 E 6th St, Austin TX',desc:'Pet friendly, near downtown, parking included.',seller:'Oak Realty',demo:1},
{id:6,title:'Nike Air Max (size 10)',price:60,cat:'Fashion',city:'Dallas',address:'12 Elm St, Dallas TX',desc:'Worn twice.',seller:'Tom B.',demo:1}];
const wseed=[{id:1,text:'Looking for a used SUV under $12k',budget:12000,city:'Austin',user:'Priya N.'},{id:2,text:'Need a gaming laptop, RTX card',budget:900,city:'Dallas',user:'Jake L.'},{id:3,text:'Want a 2-seater couch for small flat',budget:250,city:'Houston',user:'Amy S.'}];
let L=S.get('bz_l',seed),W=S.get('bz_w',wseed),C=S.get('bz_c',{}),me=S.get('bz_me',''),view='buy',cat='All';
function who(){if(!me){me=(prompt('Your name (shown to others):')||'').trim()||'Guest '+Math.floor(Math.random()*900+100);S.set('bz_me',me)}return me}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
const money=n=>'$'+Number(n).toLocaleString();
function open_(h){$('#modal').innerHTML=h;$('#ov').classList.add('on')}
function close_(){$('#ov').classList.remove('on')}
$('#ov').onclick=e=>{if(e.target.id==='ov')close_()};
document.onkeydown=e=>{if(e.key==='Escape')close_()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});
$('#q').oninput=$('#city').oninput=()=>{if(view==='buy')render(true)};
$('#post').onclick=()=>view==='wanted'?postWanted():postItem();
function render(keep){const m=$('#main');
 if(view==='buy')m.innerHTML=(keep?'':hero())+`<div class="chips">${CATS.map(([c,e])=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${e} ${c}</button>`).join('')}</div><div class="grid" id="g"></div>`,grid();
 if(view==='wanted')m.innerHTML=`<h2 style="margin-bottom:6px">Buyers looking right now</h2><p class="mu" style="margin-bottom:16px">These people want to buy. Message them with what you have.</p><div class="wlist">${W.map((w,i)=>`<div class="want" style="animation-delay:${i*60}ms"><div><span class="tag">Wants to buy</span><div style="font-weight:700;margin-top:4px">${esc(w.text)}</div><div class="mu">Budget ${money(w.budget)} · ${esc(w.city)} · ${esc(w.user)}</div></div><button class="btn" data-w="${w.id}">Text buyer</button></div>`).join('')}</div>`;
 if(view==='inbox')inbox();
 m.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;render(true)});
 m.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const w=W.find(x=>x.id==b.dataset.w);chat('W'+w.id,w.user,'Wants: '+w.text)});
 $('#post').textContent=view==='wanted'?'+ I want to buy':'+ Sell something'}
function hero(){return`<section class="hero"><h1>Buy and sell anything,<br>right in your city.</h1><p>Post in 30 seconds. Chat directly. Meet locally.</p></section>`}
function grid(){const q=$('#q').value.toLowerCase(),c=$('#city').value.toLowerCase();
 const r=L.filter(x=>(cat==='All'||x.cat===cat)&&(x.title+x.desc).toLowerCase().includes(q)&&x.city.toLowerCase().includes(c));
 $('#g').innerHTML=r.length?r.map((x,i)=>`<div class="card" data-id="${x.id}" style="animation-delay:${Math.min(i,12)*50}ms"><div class="imgw"><div class="img" style="${x.img?`background-image:url(${x.img})`:`background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 25%,var(--card)),color-mix(in srgb,var(--ac2) 25%,var(--card)))`}">${x.img?'':EM[x.cat]||'📦'}</div></div><div class="info"><div class="price">${money(x.price)}</div><div class="t">${esc(x.title)}</div><div class="mu">📍 ${esc(x.city)}</div></div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">No listings found. Be the first to post!</div>';
 $('#g').querySelectorAll('.card').forEach(e=>e.onclick=()=>detail(+e.dataset.id))}
function detail(id){const x=L.find(v=>v.id===id),mine=x.seller===me;
 open_(`<div class="img" style="border-radius:16px;aspect-ratio:16/10;${x.img?`background-image:url(${x.img})`:'background:var(--bg)'}">${x.img?'':EM[x.cat]||'📦'}</div><h2 style="margin-top:14px">${esc(x.title)}</h2><div class="price" style="font-size:24px">${money(x.price)}</div><p class="mu" style="margin:6px 0">${esc(x.cat)} · Seller: ${esc(x.seller)}</p><p>${esc(x.desc)}</p><p style="margin-top:10px">📍 <b>${esc(x.address||x.city)}</b></p><div class="row" style="margin-top:16px"><button class="btn ghost" onclick="close_()">Close</button>${mine?`<button class="btn ghost" id="del">Remove listing</button>`:`<button class="btn" id="msg" style="flex:1">💬 Message seller</button>`}</div>`);
 if($('#msg'))$('#msg').onclick=()=>chat('L'+x.id,x.seller,x.title,x.demo);
 if($('#del'))$('#del').onclick=()=>{L=L.filter(v=>v.id!==id);S.set('bz_l',L);close_();render(true)}}
function chat(key,name,sub,auto){who();const m=C[key]||(C[key]=[]);
 const draw=()=>{$('#cl').innerHTML=m.length?m.map(x=>`<div class="m ${x.me?'me':'th'}">${esc(x.t)}</div>`).join(''):'<div class="mu">Say hello 👋</div>';$('#cl').scrollTop=1e9};
 open_(`<h2>${esc(name)}</h2><div class="mu">${esc(sub)}</div><div class="chat" id="cl"></div><div class="row"><input id="ci" placeholder="Type a message…" autocomplete="off"><button class="btn" id="cs">Send</button></div><button class="btn ghost" style="margin-top:10px" onclick="close_()">Close</button>`);draw();
 const send=()=>{const v=$('#ci').value.trim();if(!v)return;m.push({me:1,t:v});S.set('bz_c',C);$('#ci').value='';draw();
  if(auto||key[0]==='W')setTimeout(()=>{m.push({t:key[0]==='W'?'Hi! Yes, I’m still looking. What do you have?':'Hi! Yes, it’s still available. When can you come see it?'});S.set('bz_c',C);if($('#cl'))draw()},1200)};
 $('#cs').onclick=send;$('#ci').onkeydown=e=>{if(e.key==='Enter')send()};$('#ci').focus()}
function inbox(){const ks=Object.keys(C).filter(k=>C[k].length);
 $('#main').innerHTML=`<h2 style="margin-bottom:14px">Messages</h2><div class="inbox">${ks.length?ks.map(k=>{const isL=k[0]==='L',o=(isL?L:W).find(v=>v.id==k.slice(1));if(!o)return'';const last=C[k].at(-1);return`<div class="thread" data-k="${k}"><b>${esc(isL?o.seller:o.user)}</b> <span class="mu">· ${esc(isL?o.title:o.text)}</span><div class="mu t">${esc(last.t)}</div></div>`}).join(''):'<div class="empty">No conversations yet.</div>'}</div>`;
 document.querySelectorAll('.thread').forEach(t=>t.onclick=()=>{const k=t.dataset.k,isL=k[0]==='L',o=(isL?L:W).find(v=>v.id==k.slice(1));chat(k,isL?o.seller:o.user,isL?o.title:o.text,o.demo)})}
function postItem(){who();open_(`<h2>Sell something</h2><div class="f"><input id="pt" placeholder="Title (e.g. 2018 Honda Civic)"><div class="row"><input id="pp" type="number" min="0" placeholder="Price $"><select id="pc">${CATS.slice(1).map(c=>`<option>${c[0]}</option>`).join('')}</select></div><textarea id="pd" rows="3" placeholder="Describe it: condition, mileage, details…"></textarea><div class="row"><input id="pcity" placeholder="City"><input id="pa" placeholder="Pickup address"></div><input id="pf" type="file" accept="image/*"><div class="row"><button class="btn ghost" onclick="close_()">Cancel</button><button class="btn" id="ps" style="flex:1">Publish</button></div></div>`);
 $('#ps').onclick=async()=>{const t=$('#pt').value.trim(),p=$('#pp').value,ci=$('#pcity').value.trim();if(!t||!p||!ci)return toast('Title, price and city are required');
  const img=await shrink($('#pf').files[0]);L.unshift({id:Date.now(),title:t,price:+p,cat:$('#pc').value,desc:$('#pd').value,city:ci,address:$('#pa').value.trim(),img,seller:me});S.set('bz_l',L);close_();view='buy';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v==='buy'));render();toast('Listing published 🎉')}}
function postWanted(){who();open_(`<h2>What do you want to buy?</h2><div class="f"><input id="wt" placeholder="e.g. Looking for a used motorbike"><div class="row"><input id="wb" type="number" placeholder="Max budget $"><input id="wc" placeholder="City"></div><div class="row"><button class="btn ghost" onclick="close_()">Cancel</button><button class="btn" id="ws" style="flex:1">Post request</button></div></div>`);
 $('#ws').onclick=()=>{const t=$('#wt').value.trim();if(!t)return toast('Describe what you need');W.unshift({id:Date.now(),text:t,budget:+$('#wb').value||0,city:$('#wc').value.trim()||'Anywhere',user:me});S.set('bz_w',W);close_();render()}}
function shrink(f){return new Promise(r=>{if(!f)return r(null);const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,700/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.onerror=()=>r(null);i.src=fr.result};fr.readAsDataURL(f)})}
render();
</script></body></html>
